name: 站点适配 / Site request
description: 请求支持一个新站点（需提供可用的测试账号或邀请，否则无法保证适配）/ Request support for a new site (a working test account or invite is required)
title: "[站点适配] "
labels: ["adapter/site"]
body:
  - type: markdown
    attributes:
      value: |
        > 🌐 English submissions are welcome — 标题与各项正文均可使用英文。

        PT 站点大多不开放注册，适配需要开发者能登录并考察站点结构。

        1. 先确认该站点**尚未被支持**：[站点支持状态](https://pt-plugins.github.io/monitor/)。已支持站点的异常请改用「站点问题反馈」。
        2. 开发者请按 Wiki 文档自行适配并提交 PR。
        3. 站点管理者请在发起 issue 后通过 [Telegram 群](https://t.me/joinchat/NZ9NCxPKXyby8f35rn_QTw) 联系开发人员。
        4. 无法提供测试账号或邀请的用户请勿提交。
        5. 多个站点需求请分别发起。

        > 请勿在本 issue 中公开账号密码，具体凭据请通过 Telegram 私下提供。

  - type: checkboxes
    id: precheck
    attributes:
      label: 提交前确认（请全部勾选） / Pre-submission checklist
      options:
        - label: 该站点**不在** [已支持站点列表](https://pt-plugins.github.io/monitor/) 中，且不是重复请求 / Not in the [supported list](https://pt-plugins.github.io/monitor/) and not a duplicate request.
          required: true
        - label: 我能提供**可用的测试账号或邀请**，或我本身就是站点管理者/开发者，可配合完成适配 / I can provide a working test account or invite, or I am the site's admin/developer and can help.
          required: true
        - label: 我理解本 issue 中**不会**出现账号、密码、邀请码等敏感凭据 / I understand this issue must not contain credentials, passwords or invite codes.
          required: true

  - type: input
    id: site_name
    attributes:
      label: 站点名称（必填） / Site name (required)
      description: 站点正式名称及常用简称 / Official site name plus common aliases.
      placeholder: 例如 HDFans（俗称：憨憨）
    validations:
      required: true
      min_length: 2

  - type: input
    id: site_url
    attributes:
      label: 站点地址（必填） / Site URL (required)
      description: 完整域名，多个域名/镜像请一并列出 / Full domain; list every mirror.
      placeholder: 例如 https://hdfans.org/
    validations:
      required: true
      min_length: 8

  - type: dropdown
    id: engine
    attributes:
      label: 站点架构（必填） / Site engine (required)
      description: 不确定可选「不清楚」 / Pick "Unknown" if unsure.
      options:
        - NexusPHP
        - Unit3D
        - Gazelle
        - Gazelle (JSON API)
        - AvistazNetwork
        - Luminance
        - Rartracker
        - TCG
        - 不清楚 / 其他 — unknown / other
    validations:
      required: true

  - type: textarea
    id: other_software_adapters
    attributes:
      label: 是否有其它软件已适配该站点？（必填，有则附链接） — Has any other tool already adapted this site? (required — attach links if yes)
      description: |
        例如 Jackett、Prowlarr、MoviePilot、autobrr、cross-seed 是否已支持该站点。它们的定义文件、源码或站点 API 文档可直接参考。
        确实没有请填「无」，不了解请填「不清楚」，不要留空。

        Do Jackett, Prowlarr, MoviePilot, autobrr, cross-seed or similar tools already support it? Paste their definitions, source or API docs. Write "None" / "Unknown" if not applicable; do not leave it blank.
      placeholder: |
        - Jackett：例如 https://github.com/Jackett/Jackett/blob/master/src/Jackett.Common/Definitions/xxx.yml
        - Prowlarr：例如 https://github.com/Prowlarr/Prowlarr/blob/develop/src/NzbDrone.Core/Indexers/Definitions/Xxx.cs
        - MoviePilot：例如 https://github.com/jxxghp/MoviePilot/blob/main/app/helper/sites/xxx.py
        - 其它（autobrr、cross-seed、站点 API 文档、第三方脚本等）：
        - 若均无：
    validations:
      required: true

  - type: input
    id: category
    attributes:
      label: 资源类型（必填） / Content type (required)
      description: 站点主要内容类型，可多填 / Main content type(s); multiple allowed.
      placeholder: 例如 影视 / 综合 / 音乐 / 电子书 / 游戏 / 学习资料
    validations:
      required: true
      min_length: 2

  - type: dropdown
    id: open_registration
    attributes:
      label: 开放注册（必填） / Open registration (required)
      options:
        - 是（当前可自由注册） / Yes (open signup right now)
        - 否（仅邀请注册） / No (invite only)
        - 限时开放 / Open for a limited time
        - 不清楚 / Unknown
    validations:
      required: true

  - type: textarea
    id: site_rules
    attributes:
      label: 站点规则 / 限制（必填） — Site rules and limits (required)
      description: 是否允许第三方工具抓取、API 或搜索频率限制、分享率与 H&R 规则、等级制度、二次验证、CloudFlare 防护等 / E.g. third-party tool policy, API/search rate limits, ratio and H&R rules, user classes, 2FA, Cloudflare protection.
      placeholder: |
        - 分享率 / H&R 规则：
        - 搜索频率或 API 限制：
        - 是否允许插件类工具：允许 / 禁止 / 未明确
        - 其他注意事项：
    validations:
      required: true
      min_length: 20

  - type: textarea
    id: access
    attributes:
      label: 测试账号 / 邀请的提供方式（必填） — How you can provide access (required)
      description: 说明如何提供访问权限；**不要**在此填写账号密码 / Explain how access can be arranged; do **not** put credentials here.
      placeholder: |
        例如：可提供限时临时账号，已在 Telegram 群中联系 @xxx，可私聊提供；
        或：我是站点管理者，可长期提供测试账号
    validations:
      required: true
      min_length: 15

  - type: textarea
    id: extra
    attributes:
      label: 其他补充信息 / Anything else
      description: 站点特色功能、同架构且已适配的站点、希望优先支持的功能等 / Notable features, same-engine sites already adapted, features that matter most.
    validations:
      required: false
