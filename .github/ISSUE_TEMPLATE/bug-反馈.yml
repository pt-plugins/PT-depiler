name: Bug 反馈 / Bug report
description: 反馈与具体 PT 站点无关的通用 Bug（站点相关问题请用「站点问题反馈」模板）/ General bugs not tied to one PT site (use the "Site issue" template for site-specific problems)
title: "[Bug] "
type: bug
body:
  - type: markdown
    attributes:
      value: |
        > 🌐 English submissions are welcome — 标题与各项正文均可使用英文。

        - 与具体站点有关的问题（数据获取、搜索、等级时魔、下载、Cookie、浮窗等）请使用「站点问题反馈」模板。
        - 提问、求邀请等请到 [Telegram 群](https://t.me/joinchat/NZ9NCxPKXyby8f35rn_QTw)，不要开 issue。
        - 缺少版本、复现步骤、日志或截图的 issue 会被关闭。

  - type: checkboxes
    id: precheck
    attributes:
      label: 提交前确认（请全部勾选） / Pre-submission checklist
      options:
        - label: 已在**最新版本**（或最新 master 构建）上复现 / Reproduced on the latest version (or latest master build).
          required: true
        - label: 已搜索现有 issue，确认没有重复 / Searched existing issues; not a duplicate.
          required: true
        - label: 该问题与**具体 PT 站点无关** / Not specific to one PT site.
          required: true
        - label: 我理解信息不足（缺少版本、复现步骤、截图或日志）的 issue 会被关闭 / I understand incomplete reports will be closed.
          required: true

  - type: dropdown
    id: browser
    attributes:
      label: 浏览器（必填） / Browser (required)
      options:
        - Chrome
        - Edge
        - Firefox
        - 其他（请在下方说明） / Other (please explain below)
    validations:
      required: true

  - type: input
    id: browser_version
    attributes:
      label: 浏览器版本（必填） / Browser version (required)
      description: 浏览器「关于」页面或 chrome://version 查看 / See the "About" page or chrome://version.
      placeholder: 例如 141.0.7390.55
    validations:
      required: true
      min_length: 2

  - type: input
    id: ptd_version
    attributes:
      label: PT-depiler 版本 / 构建来源（必填） — Version or build (required)
      description: 扩展管理页（chrome://extensions）或「设置 → 关于」查看；自行构建请附 commit / See chrome://extensions or "Settings → About"; include the commit if self-built.
      placeholder: 例如 0.3.1 商店版 / master@d590a3df
    validations:
      required: true
      min_length: 2

  - type: textarea
    id: description
    attributes:
      label: 问题描述（必填） / Problem description (required)
      description: 写清「预期发生什么」与「实际发生什么」；界面问题请注明页面与按钮 / State both expected and actual behaviour; name the page and button for UI issues.
      placeholder: |
        预期：...
        实际：...
    validations:
      required: true
      min_length: 20

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤（必填） / Steps to reproduce (required)
      description: 按顺序写清每一步，确保可复现 / List every step in order.
      placeholder: |
        1. 打开插件「...」页面
        2. 点击「...」
        3. 观察到 ...
    validations:
      required: true
      min_length: 20

  - type: textarea
    id: logs
    attributes:
      label: 错误信息 / 日志（必填） — Errors and logs (required)
      description: 「关于 → 插件运行日志」→ 对应记录「详情」复制粘贴；F12 Console 的红色报错也请附上 / Open "About → Extension logs", copy the relevant entries; include red console errors from F12.
      render: shell
    validations:
      required: true
      min_length: 20

  - type: textarea
    id: screenshots
    attributes:
      label: 相关截图 / Screenshots
      description: 图片可直接拖入本框上传；请遮挡账号等个人信息 / Drag images here; mask personal data.
      placeholder: 拖拽图片到此处上传，或粘贴图片链接
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 其他补充信息 / Anything else
      description: 例如仅在特定设置、网络环境（代理 / 直连）或操作顺序下出现
    validations:
      required: false
