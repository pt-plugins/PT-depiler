name: 功能请求 / Feature request
description: 发起新功能请求或对现有功能提出改进建议 / Request a new feature or suggest an improvement
title: "[Feature] "
type: feature
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        > 🌐 English submissions are welcome — 标题与各项正文均可使用英文。

        - 本模板用于**新功能请求**与**功能改进**。
        - **自定义站点、自定义站点插件等部分功能不会实现**，请勿提出。
        - 站点数据、搜索、等级时魔异常请用「站点问题反馈」；与站点无关的 Bug 请用「Bug 反馈」；请求支持新站点请用「站点适配」。

  - type: checkboxes
    id: precheck
    attributes:
      label: 提交前确认（请全部勾选） / Pre-submission checklist
      options:
        - label: 已搜索现有 issue 与 CHANGELOG，确认该功能尚未实现、也没有重复请求 / Searched existing issues and the CHANGELOG; neither implemented nor already requested.
          required: true
        - label: 我理解「自定义站点 / 自定义站点插件」等部分功能不会实现 / I understand that some features (custom sites, custom site plugins, …) will not be implemented.
          required: true

  - type: dropdown
    id: request_type
    attributes:
      label: 需求类型（必填） / Request type (required)
      description: 选择最贴近的一项 / Pick the closest option.
      options:
        - 全新功能 / New feature
        - 对现有功能的改进 / Improvement to existing behaviour
        - 其他（请在下方说明） / Other (please explain below)
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 需求描述与原因（必填） / Problem and motivation (required)
      description: 说明现状、问题，以及为什么需要这个功能 / Describe the problem and why the feature is needed.
      placeholder: |
        现状 / 遇到的问题：...
        希望解决：...
    validations:
      required: true
      min_length: 20

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案（必填） / Expected solution (required)
      description: 期望的界面位置、交互方式与结果 / UI placement, interaction and expected result.
      placeholder: 例如：在「我的数据」页面增加 xxx 按钮，点击后 ...
    validations:
      required: true
      min_length: 10

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives considered
      description: 可附参考实现、截图、上游项目或同类插件链接 / Reference implementations, screenshots, upstream projects or similar plugins.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 其他附加信息 / Anything else
      description: 截图与参考链接（图片可直接拖入本框上传） / Screenshots and reference links (drag images into this box).
    validations:
      required: false
