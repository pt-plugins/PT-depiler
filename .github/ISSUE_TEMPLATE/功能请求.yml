name: 功能请求
description: 发起新功能请求，或对原 PT-Plugin-Plus 中已有、PTD 尚未实现的功能提出迁移需求
title: "[Feature] "
type: feature
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## 提交前请先确认模板选对了

        - 本模板用于：**新功能请求**、**功能改进**，以及**原 PT-Plugin-Plus（PTPP）中已有功能向 PTD 的迁移需求**。
        - ⚠️ 注意：**自定义站点、自定义站点插件等部分功能不会实现**，请勿提出。
        - 站点数据获取 / 搜索 / 等级时魔异常请使用 **「站点问题反馈」**；与站点无关的 Bug 请使用 **「Bug 反馈」**；请求支持新站点请使用 **「站点适配」**。

  - type: checkboxes
    id: precheck
    attributes:
      label: 提交前确认（请全部勾选）
      options:
        - label: 我已搜索过现有 issue 与 CHANGELOG，确认该功能尚未实现、也没有重复请求
          required: true
        - label: 我理解「自定义站点 / 自定义站点插件」等部分功能不会实现
          required: true

  - type: dropdown
    id: request_type
    attributes:
      label: 需求类型（必填）
      description: 若为 PTPP 已有功能迁移，请选择第二项，并填写下面的 PTPP 专用问题
      options:
        - 全新功能（PTPP 与 PTD 均未实现）
        - PTPP 已有功能迁移（原 PT-Plugin-Plus 已实现，PTD 尚未实现）
        - 对现有功能的改进 / 行为调整
        - 其他（请在下方说明）
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 需求描述与原因（必填）
      description: 请简明扼要地描述问题所在，以及为什么需要这个功能；若是 PTPP 已有功能迁移，请一并说明它解决什么问题
      placeholder: |
        现状 / 遇到的问题：...
        希望解决：...
    validations:
      required: true
      min_length: 20

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案（必填）
      description: 描述你想要的解决方案，欢迎提供脑洞（界面位置、交互方式、期望结果等）
      placeholder: 例如：在「我的数据」页面增加 xxx 按钮，点击后 ...
    validations:
      required: true
      min_length: 10

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 如果有参考实现、截图、上游项目或其它插件的链接，请在此附上
    validations:
      required: false

  - type: textarea
    id: ptpp_behavior
    attributes:
      label: 【PTPP 迁移专用】这一功能在原 PT-Plugin-Plus 中是怎么展现的？
      description: 仅当「需求类型」选择「PTPP 已有功能迁移」时填写；请说明功能入口与操作流程，并提供截图
      placeholder: |
        入口位置：例如 设置 → xxx 页面、种子列表右键菜单
        操作流程：...
        截图：拖拽图片到此处上传
    validations:
      required: false

  - type: textarea
    id: ptd_suggestion
    attributes:
      label: 【PTPP 迁移专用】你对这一功能在 PTD 中实现有什么更好的建议？
      description: 例如希望结合 PTD 现有的搜索方案、下载器、备份等机制做得更好
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 其他附加信息
      description: 可以添加屏幕截图、参考链接等信息（图片直接拖拽到输入框即可上传）
    validations:
      required: false
