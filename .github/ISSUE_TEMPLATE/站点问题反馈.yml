name: 站点问题反馈 / Site issue
description: 已支持站点的数据、搜索、下载、等级、时魔等异常（请逐项填写，不接受一句话描述）/ Problems with a supported site — data, search, download, user class, seeding bonus (one-line reports are rejected)
title: "[站点问题] "
type: bug
labels: ["adapter/site"]
body:
  - type: markdown
    attributes:
      value: |
        > 🌐 English submissions are welcome — 标题与各项正文均可使用英文。

        站点问题可能来自站点改版、账号等级/权限不足、CF 拦截、代理线路或插件选择器失效。缺少必要信息的 issue 无法复现，会被关闭。

        请逐项填写，标「必填」的项目都会校验。

        | 需要的值 | 在哪里看 |
        | --- | --- |
        | 站点名称 / 站点定义名称 | 「设置 → 站点设置」站点列表；或「开发工具 → 调试信息」的 `site` 下拉框（**照抄英文名，不要用俗称**） |
        | 站点架构、站点定义内容 | 「开发工具 → 调试信息」→ 选择站点 →「输出站点定义」，内容打印在 Console（F12） |
        | 运行日志、请求失败详情 | 「关于 → 插件运行日志」→ 对应记录右侧「详情」 |
        | 站点是否已被支持 | [站点支持状态](https://pt-plugins.github.io/monitor/) |

        站点尚未被支持请用「站点适配」模板；与站点无关的 Bug 请用「Bug 反馈」模板。

  - type: checkboxes
    id: precheck
    attributes:
      label: 提交前确认（请全部勾选） / Pre-submission checklist
      options:
        - label: 该站点在 [站点支持状态](https://pt-plugins.github.io/monitor/) 中属于**已支持** / The site is listed as **supported** in the [support status page](https://pt-plugins.github.io/monitor/).
          required: true
        - label: 站点可正常访问，且插件中处于**已登录**状态（非「需要登录！」/ CF 拦截 / 账号被封） / The site loads fine and the extension shows it as **logged in** (not "Login required!", CF-blocked or banned).
          required: true
        - label: 使用的是**最新版本**（或最新 master 构建），并已在该版本上复现 / On the latest version (or latest master build) and reproduced there.
          required: true
        - label: 已搜索现有 issue，确认没有重复 / Searched existing issues; not a duplicate.
          required: true
        - label: 我理解缺少站点名称、地址、复现条件或日志的 issue 会被关闭 / I understand reports missing the site name, URL, reproduction details or logs will be closed.
          required: true

  - type: input
    id: site_name
    attributes:
      label: 站点名称 / 站点定义名称（必填） — Site name or site-definition name (required)
      description: 使用插件中显示的站点定义名称（英文 id 或界面显示名），不要用俗称 / Use the site-definition name shown by the extension; no nicknames.
      placeholder: 例如 HDFans（或 hdfans）
    validations:
      required: true
      min_length: 2

  - type: input
    id: site_url
    attributes:
      label: 站点地址（必填） / Site URL (required)
      description: 填写你实际访问的完整域名（多域名/镜像可能导致不同结果） / The exact full domain you use; mirrors may behave differently.
      placeholder: 例如 https://hdfans.org/
    validations:
      required: true
      min_length: 8

  - type: dropdown
    id: engine
    attributes:
      label: 站点架构（必填） / Site engine (required)
      description: 不确定请选「不清楚」 / Pick "Unknown" if unsure.
      options:
        - NexusPHP
        - Unit3D
        - Gazelle
        - Gazelle (JSON API)
        - AvistazNetwork
        - Luminance
        - Rartracker
        - TCG
        - 不清楚 / 其他 — unknown / other
    validations:
      required: true

  - type: dropdown
    id: feature
    attributes:
      label: 出问题的功能 / 页面（必填，可多选） — Affected feature or page (required, multiple allowed)
      multiple: true
      options:
        - 我的数据（用户信息、上传/下载量、分享率） / My data — profile, upload/download totals, ratio
        - 我的数据（等级、升级条件、时魔） / My data — user class, promotion requirements, seeding bonus
        - 我的数据（H&R、做种数、发种数等统计） / My data — H&R, seeding / upload statistics
        - 搜索结果（搜索无结果 / 结果缺项 / 促销与免费标记错误） / Search — no results, missing results, wrong promo/free flags
        - 搜索结果（分类、IMDb、关键字等查询参数） / Search — query parameters such as category, IMDb id, keywords
        - 下载种子 / 推送到下载器 — Downloading a torrent or pushing it to a downloader
        - 收藏、消息、签到等其它接口 / Other endpoints — favourites, messages, check-in, etc.
        - content-script（站点页面内注入的浮窗按钮） / Content script — the floating button injected into site pages
        - Cookie / 自动延长 Cookie / 登录状态 — Cookie handling, cookie auto-extension, login state
        - 其他（请在下方说明） / Other (please explain below)
    validations:
      required: true

  - type: textarea
    id: symptom
    attributes:
      label: 实际现象（必填） / What actually happens (required)
      description: 写清界面显示的状态文字（如「获取成功但数据为 0」「解析错误！」「CloudFlare 错误！」「需要登录！」「无结果！」）及涉及的具体数值/字段 / Quote the **status text** shown in the UI and the concrete values/fields involved.
      placeholder: |
        页面显示的状态：例如「解析错误！」
        具体表现：例如「我的数据」中该站点上传量/等级为空，其它站点正常；
        或：搜索「关键字 xxx」返回 0 条，但站点网页上手动搜索有结果
    validations:
      required: true
      min_length: 30

  - type: textarea
    id: expected
    attributes:
      label: 期望结果（必填） / Expected result (required)
      description: 对照站点网页上的真实数据，说明插件应显示的结果 / What the extension should show, based on the real data on the site.
      placeholder: 例如：站点个人页显示上传量 1.23 TB、等级 Power User，插件应一致
    validations:
      required: true
      min_length: 10

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤（必填） / Steps to reproduce (required)
      description: 按顺序写清每一步，确保可复现 / List every step in order.
      placeholder: |
        1. 打开插件「我的数据」页面
        2. 点击刷新 / 仅刷新该站点
        3. 观察该站点行显示 ...
    validations:
      required: true
      min_length: 20

  - type: textarea
    id: account_env
    attributes:
      label: 账号状态与运行环境（必填） / Account state and environment (required)
      description: 用于判断问题是等级/权限/网络环境导致的，还是插件本身的问题 / Helps tell whether the cause is user class, permissions or network, rather than the extension.
      placeholder: |
        - 浏览器及版本：例如 Edge 141.0.7390.55
        - PT-depiler 版本 / 构建来源：例如 0.3.1 商店版 / master@d590a3df
        - 该站点账号等级：例如 Power User（或填写：不确定等级）
        - 网络环境：直连 / 系统代理 / 扩展代理（若为代理请写明）
        - 该站点是否开启二次验证、是否有未读警告或未消除的 H&R：
        - 同一时间其它站点是否正常：
        - 该站点最近是否改版、是否更换过域名：
    validations:
      required: true
      min_length: 30

  - type: textarea
    id: logs
    attributes:
      label: 日志与错误信息（必填） / Logs and errors (required)
      description: 「关于 → 插件运行日志」→ 对应记录「详情」复制粘贴；F12 Console 的红色报错也请附上 / Open "About → Extension logs", copy the relevant entries; include red console errors from F12.
      render: shell
    validations:
      required: true
      min_length: 20

  - type: input
    id: search_query
    attributes:
      label: 搜索类问题专用：查询条件 / Search issues only — the query used
      description: 仅搜索问题填写：关键字、分类、搜索方案（最好附上站点网页上同条件可搜到结果的链接） / Only for search issues: keywords, category, search profile, ideally with a site URL returning results for the same query.
      placeholder: 例如 关键字「示例」，分类「电影」，搜索方案「默认」
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: 相关截图 / Screenshots
      description: 图片可直接拖入本框上传；建议同时提供站点网页真实数据与插件显示结果，并**遮挡个人信息** / Drag images here; ideally one screenshot of the site data and one of the extension's result — **mask personal information**.
      placeholder: 拖拽图片到此处上传，或粘贴图片链接
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 其他补充信息 / Anything else
      placeholder: 例如仅在批量刷新时出现、只在开启某选项后出现、历史版本是否正常等
    validations:
      required: false
