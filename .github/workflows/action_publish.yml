name: Build Publish Release

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: "强制运行（跳过「自上次发布以来无新增提交」的门槛判断）"
        type: boolean
        default: false
  schedule:
    # 北京时间（Asia/Shanghai）每周日上午 04:00 自动构建发布。
    # timezone 为 GitHub Actions 新增的 schedule 字段（IANA 时区名，缺省为 Etc/UTC），
    # 直接写本地时间比手算 UTC 偏移更不易出错，且不受夏令时影响。
    # 见 https://docs.github.com/zh/actions/reference/workflows-and-actions/workflow-syntax#onschedule
    # 周日凌晨发布可让周五/周六攒下的域名轮换与站点定义更新当周就进入各扩展商店。
    - cron: '0 4 * * 0'
      timezone: "Asia/Shanghai"

jobs:
  # 发布门槛：只有当「自上一次 GitHub Release 以来，仓库提交数确实增加了」才继续。
  # 定时触发时若这一周没有任何新提交，整条流水线跳过，避免无谓地重复构建，
  # 也避免反复向三个扩展商店提交同一版本。
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Checkout（取全量历史与 tags，用于提交数比对）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 判断是否新增了提交
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event.inputs.force_run || 'false' }}
        run: |
          set -euo pipefail

          emit() {  # $1=should_run $2=reason
            echo "should_run=$1" >> "$GITHUB_OUTPUT"
            echo "reason=$2" >> "$GITHUB_OUTPUT"
            echo "::notice::should_run=$1 ($2)"
          }

          if [ "$FORCE" = "true" ]; then
            emit "true" "manual-force"
            exit 0
          fi

          # 上一次发布用的 tag（取发布时间最新的一个 Release）
          LAST_TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty' 2>/dev/null || true)"
          if [ -z "$LAST_TAG" ]; then
            emit "true" "no-previous-release"
            exit 0
          fi

          LAST_SHA="$(git rev-list -n1 "refs/tags/$LAST_TAG" 2>/dev/null || true)"
          if [ -z "$LAST_SHA" ]; then
            # tag 存在却解析不到提交（例如历史被改写），保守放行
            emit "true" "tag-unresolvable:$LAST_TAG"
            exit 0
          fi

          # LAST_SHA..HEAD 的提交数 == 上次发布之后新增的提交数
          AHEAD="$(git rev-list --count "$LAST_SHA..$GITHUB_SHA" 2>/dev/null || echo -1)"
          if [ "$AHEAD" -lt 0 ]; then
            emit "true" "count-failed:$LAST_TAG"
            exit 0
          fi

          if [ "$AHEAD" -gt 0 ]; then
            emit "true" "commits-ahead:$AHEAD"
          else
            emit "false" "no-new-commits-since:$LAST_TAG"
          fi

  build:
    needs: check
    # 门槛未通过时整个可复用构建工作流跳过，publish 也随之 skipped
    if: needs.check.outputs.should_run == 'true'
    uses: ./.github/workflows/action_build.yml

  publish:
    runs-on: ubuntu-latest
    needs: build
    # 构建被门槛跳过时不要执行发布步骤
    if: needs.build.result == 'success'
    permissions:
      contents: write

    steps:
      # 安装 wepub CLI（iorate/wepub），用于发布到 Chrome / Firefox / Edge 扩展商店
      # Chrome Web Store API v2 / Firefox Add-ons API v5 / Edge Add-ons API v1.1
      - name: Setup wepub
        uses: iorate/wepub/setup@v1

      # 下载 action_build.yml 构造出来的 extension-chrome.zip, extension-firefox.zip 两个文件
      - name: Download Chrome Built Artifact
        uses: actions/download-artifact@v8
        with:
          pattern: build-zip-*
          merge-multiple: true

      # 发布 GitHub Release
      - id: github_release
        uses: ncipollo/release-action@v1
        with:
          name: v${{ needs.build.outputs.version }}
          tag: v${{ needs.build.outputs.version }}
          skipIfReleaseExists: true
          generateReleaseNotes: true
          artifacts: 'extension-chrome.zip,extension-firefox.zip'

      # 提交至 Chrome Web Store
      # 凭证经 WEPUB_* 环境变量传入（与 --chrome-publisher-id 等 flag 等价）
      # 注意：CWS API v2 需要 Publisher ID（CHROME_PUBLISHER_ID，区别于扩展 ID）
      # 认证方式：service account。wepub 本身不接受 SA 凭证，故先用 SA 私钥自签 JWT
      # 换取 1 小时有效的 access token，再经 WEPUB_CHROME_ACCESS_TOKEN 传入。
      # 不用 gcloud：`gcloud auth print-access-token` 不带 --impersonate 时会按 GCP
      # 自身的 scope 白名单校验，chromewebstore 不在其列，必然报 Invalid scopes value。
      # 本方式与 refresh token 模式互斥，故不可设置 WEPUB_CHROME_REFRESH_TOKEN
      # CLIENT_ID / CLIENT_SECRET 在 access token 模式下必须一并移除：
      # 设置 WEPUB_CHROME_ACCESS_TOKEN 后，wepub 会因这两个变量而报错
      - name: Publish to Chrome Web Store
        if: ${{ steps.github_release.outputs.id != '' }}
        continue-on-error: true
        env:
          WEPUB_CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          WEPUB_CHROME_ITEM_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_SERVICE_ACCOUNT_JSON: ${{ secrets.CHROME_SERVICE_ACCOUNT_JSON }}
        run: |
          # 未配置 service account 时直接跳过，避免 JSON.parse(undefined) 抛出难懂的错误
          if [ -z "$CHROME_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::secret CHROME_SERVICE_ACCOUNT_JSON is not set, skip Chrome Web Store publish"
            exit 1
          fi
          # 自签 JWT 换取 access token 并立即注册脱敏规则，
          # 避免 token 经 set -x / 调试日志或 wepub 自身日志泄漏到 Actions log
          TOKEN="$(node -e '
            const crypto = require("crypto");
            (async () => {
              const key = JSON.parse(process.env.CHROME_SERVICE_ACCOUNT_JSON);
              const b64 = (s) => Buffer.from(s).toString("base64url");
              const now = Math.floor(Date.now() / 1000);
              const input =
                b64(JSON.stringify({ alg: "RS256", typ: "JWT" })) + "." +
                b64(JSON.stringify({
                  iss: key.client_email,
                  scope: "https://www.googleapis.com/auth/chromewebstore",
                  aud: "https://oauth2.googleapis.com/token",
                  iat: now, exp: now + 3600,
                }));
              const assertion = input + "." + crypto.createSign("RSA-SHA256")
                .update(input).sign(key.private_key).toString("base64url");

              const res = await fetch("https://oauth2.googleapis.com/token", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({
                  grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer",
                  assertion,
                }),
              });
              const json = await res.json();
              if (!json.access_token) {
                console.error(res.status, JSON.stringify(json));
                process.exit(1);
              }
              process.stdout.write(json.access_token);
            })().catch((e) => { console.error(e); process.exit(1); });
          ')"
          if [ -z "$TOKEN" ]; then
            echo "::error::failed to obtain Chrome Web Store access token"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          export WEPUB_CHROME_ACCESS_TOKEN="$TOKEN"
          wepub chrome extension-chrome.zip

      # 下载用于 Firefox 商店提交的源码，并固定到本次工作流提交
      - run: wget "https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip" -O source.zip

      # 提交至 Firefox Add-ons
      # AMO API 凭证沿用原 FIREFOX_JWT_ISSUER / FIREFOX_JWT_SECRET（即 AMO API Key/Secret）
      # channel 沿用 secrets.FIREFOX_CHANNEL，缺省回退 listed
      - name: Publish to Firefox Add-ons
        if: ${{ steps.github_release.outputs.id != '' }}
        continue-on-error: true
        env:
          WEPUB_FIREFOX_ADDON_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          WEPUB_FIREFOX_API_KEY: ${{ secrets.FIREFOX_JWT_ISSUER }}
          WEPUB_FIREFOX_API_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          FIREFOX_CHANNEL: ${{ secrets.FIREFOX_CHANNEL }}
        run: |
          wepub firefox extension-firefox.zip \
            --source source.zip \
            --channel "${FIREFOX_CHANNEL:-listed}"

      # 提交至 Microsoft Edge Add-ons
      - name: Publish to Microsoft Edge Add-ons
        if: ${{ steps.github_release.outputs.id != '' }}
        continue-on-error: true
        env:
          WEPUB_EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          WEPUB_EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          WEPUB_EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: wepub edge extension-chrome.zip
